<script>
window.onerror = function(msg, url, lineNo, colNo, error) {
  console.error("GLOBAL ERROR:", msg, url, lineNo, error);
  var div = document.createElement("div");
  div.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999999;background:#ff0033;color:#fff;padding:12px;font-family:sans-serif;font-size:13px;font-weight:bold;text-align:center;";
  div.textContent = "Error: " + msg + " at " + (url ? url.split('/').pop() : 'script') + ":" + lineNo;
  if (document.body) { document.body.appendChild(div); }
  else { window.addEventListener("DOMContentLoaded", function() { document.body.appendChild(div); }); }
};
</script>
